# The same rules for a cluster-hosted release directory (k8s ingress / Cloud Run sidecar).
# Kept beside the Cloudflare rules so the two cannot drift apart unnoticed; owl-e2e's
# hosting check is what actually proves a deployment matches them.

types {
    application/wasm  wasm;
}

location ~ ^/assets/releases/[^/]+/owl-manifest\.json$ {
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    default_type application/json;
}

location ~ ^/assets/releases/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # A release path is content-addressed by its release id, so a conditional request is
    # pure overhead once the response is in a cache.
    etag off;
}

# Only for products whose release declares requiresCrossOriginIsolation.
location ^~ /app/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
}
